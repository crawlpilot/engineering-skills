# Fixture: "This silently fails sometimes. Fix it."
# fetch_rate catches every exception and returns None; convert() then fails far
# away with a TypeError. holidays.py shows the project's convention: catch the
# narrow error, raise ServiceError with context, chain the cause.
id: coding-standards-swallowed-python
language: python
test_command: "{python} -m pytest -q -p no:cacheprovider"

checks:
  - name: existing tests still pass
    only_if: failures raise with context and cause
    type: run
    gate: true
    points: 10
  - name: failures raise with context and cause
    type: run
    overlay: grading/hidden
    points: 45
  - name: follows the project's error convention
    type: run
    overlay: grading/convention
    points: 10
  - name: no broad catch left
    only_if: failures raise with context and cause
    type: grep
    files: src/rates/client.py
    pattern: "except\\s*(\\(?\\s*(Exception|BaseException)\\b[^:]*)?:"
    expect: absent
    points: 15
  - name: touches only what the fix needs
    only_if: failures raise with context and cause
    type: unchanged
    files: "{pyproject.toml,src/rates/errors.py,src/rates/holidays.py,src/rates/transport.py}"
    points: 10
  - name: ran the tests
    type: ran
    pattern: "pytest"
    points: 10
