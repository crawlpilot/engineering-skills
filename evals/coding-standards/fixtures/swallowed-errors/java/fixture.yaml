# Fixture: "This silently fails sometimes. Fix it." See ../python/fixture.yaml.
id: coding-standards-swallowed-java
language: java
test_command: mvn -q -B -o test
prepare_command: mvn -q -B test

checks:
  - name: existing tests still pass
    only_if: failures raise with context and cause
    type: run
    gate: true
    points: 10
  - name: failures raise with context and cause
    type: run
    overlay: grading/hidden
    points: 45
  - name: follows the project's error convention
    type: run
    overlay: grading/convention
    points: 10
  - name: no broad catch left
    only_if: failures raise with context and cause
    type: grep
    files: src/main/java/com/example/rates/RateClient.java
    pattern: "catch\\s*\\(\\s*(final\\s+)?(Exception|Throwable)\\s+\\w+\\s*\\)"
    expect: absent
    points: 15
  - name: touches only what the fix needs
    only_if: failures raise with context and cause
    type: unchanged
    files: "{pom.xml,src/main/java/com/example/rates/ServiceException.java,src/main/java/com/example/rates/HolidayClient.java,src/main/java/com/example/rates/Transport.java}"
    points: 10
  - name: ran the tests
    type: ran
    pattern: "\\b(mvn|mvnw|gradle|gradlew)\\b.*\\btest\\b"
    points: 10
