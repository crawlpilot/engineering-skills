[project]
name = "weather"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["requests>=2.31,<3", "urllib3>=2.5"]

[dependency-groups]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
