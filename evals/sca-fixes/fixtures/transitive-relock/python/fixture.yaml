# Fixture: "Fix GHSA-pq67-6m6q-mj2v."
# uv.lock pins urllib3 2.2.1, reached only through requests. The advisory
# (CVE-2025-50181) is fixed in urllib3 2.5.0, and requests>=2.31,<3 already allows
# that. The right fix is a targeted relock of urllib3, not a manifest change or an
# upgrade of everything. Verified against PyPI's vulnerability data, Nov 2026.
id: sca-fixes-relock-python
language: python
requires: [uv]
test_command: "uv lock --check -q && uv run -q --frozen --group test pytest -q -p no:cacheprovider"

checks:
  - name: lock is consistent and tests pass
    type: run
    gate: true
    points: 10
  - name: urllib3 resolves to a fixed version
    type: uv_lock
    package: urllib3
    min_version: "2.5.0"
    points: 40
  - name: requests left where it was (targeted relock)
    only_if: urllib3 resolves to a fixed version
    type: uv_lock
    package: requests
    same_as_start: true
    points: 15
  - name: unrelated packages left alone
    only_if: urllib3 resolves to a fixed version
    type: uv_lock
    package: certifi
    same_as_start: true
    points: 5
  - name: unrelated packages left alone (idna)
    only_if: urllib3 resolves to a fixed version
    type: uv_lock
    package: idna
    same_as_start: true
    points: 5
  - name: no manifest change
    only_if: urllib3 resolves to a fixed version
    type: unchanged
    files: pyproject.toml
    points: 10
  - name: report shows the dependency path
    type: report
    patterns: ["(?i)requests", "(?i)urllib3", "(?i)GHSA-pq67-6m6q-mj2v|CVE-2025-50181"]
    points: 10
  - name: lockfile regenerated by uv
    type: ran
    pattern: "\\buv\\s+lock\\b"
    points: 5
