[project]
name = "accounts"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
test = ["pytest>=8", "testcontainers[postgres]>=4.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accounts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Integration tests live in tests/integration and carry this marker; CI runs them
# in a separate stage with `pytest -m integration`.
markers = ["integration: needs a running database container"]
