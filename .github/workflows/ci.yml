name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Skill structure and links
        run: python3 scripts/validate.py && python3 scripts/test_validate.py
      - name: Every code example parses
        run: python3 scripts/check_examples.py
      - name: Eval harness unit tests
        run: python3 scripts/evals/test_evals.py

  fixtures:
    # Proves each eval fixture is fair: the starting project builds, every mutant
    # compiles and survives the existing tests, a known-good answer scores 100, and
    # a known-weak answer and doing nothing both score 60 or less.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: [unit-testing, integration-testing, code-review, coding-standards, design-patterns, sca-fixes]
        language: [java, kotlin, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - if: matrix.language != 'python'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - if: matrix.language == 'python'
        uses: astral-sh/setup-uv@v6
      - name: Fixture self-test
        # --strict: a fixture that needs Docker or uv fails here instead of skipping.
        run: python3 scripts/evals/selftest_fixtures.py --strict --skill ${{ matrix.skill }} --language ${{ matrix.language }}

  harness:
    # Runs the full eval pipeline with a stand-in agent: no model calls, no secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: End-to-end run with the fake agent
        # One mutation fixture and one checks fixture with a feature branch.
        run: |
          python3 scripts/evals/run_evals.py --skill unit-testing --language python \
            --agent-cmd "python3 $GITHUB_WORKSPACE/scripts/evals/fake_agent.py" \
            --out "$RUNNER_TEMP/eval-unit"
          grep -q "| +92 |" "$RUNNER_TEMP/eval-unit/summary.md"
          python3 scripts/evals/run_evals.py --skill code-review --language python \
            --agent-cmd "python3 $GITHUB_WORKSPACE/scripts/evals/fake_agent.py" \
            --out "$RUNNER_TEMP/eval-review"
          grep -q "| +100 |" "$RUNNER_TEMP/eval-review/summary.md"
